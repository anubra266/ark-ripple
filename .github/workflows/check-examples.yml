name: Check Examples Parity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install
        uses: ./.github/composite-actions/pnpm-install

      - run: pnpm run check:examples
