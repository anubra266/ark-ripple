name: Check Examples Parity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun scripts/check-examples-parity.ts
